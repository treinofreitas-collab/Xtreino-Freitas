kind = "web"
previewPath = "/"
title = "X-Treino Freitas"
description = "Portal da X-Treino Freitas para inscrições em treinos e campeonatos, área de clientes e administração, além de produtos digitais e itens da marca."
version = "1.0.0"
id = "artifacts/xtreino"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24841

[services.development]
run = "pnpm --filter @workspace/xtreino run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xtreino", "run", "build" ]
serve = "static"
publicDir = "artifacts/xtreino/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24841"
BASE_PATH = "/"
